name: Deploy Dockerhub

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Check for Hardcoded Env Variables or New Placeholders
        run: |
          # Approved placeholders list
          APPROVED_KEYS="DATABASE_URL SECRET_KEY API_KEY PASSWORD USERNAME"
          
          # Check for hardcoded values
          if git diff HEAD^ HEAD -- src/main/resources/application.properties | grep '^[+]' | grep -E '^(DATABASE_URL|SECRET_KEY|API_KEY|PASSWORD|USERNAME)=' | grep -v '\${'; then
            echo "🚨 Hardcoded environment variables found in application.properties! Build stopped."
            exit 1
          fi
          
          # Check for new placeholders
          NEW_KEYS=$(git diff HEAD^ HEAD -- src/main/resources/application.properties | grep '^[+]' | grep '=' | awk -F '=' '{print $1}' | sed 's/^+//')

          for key in $NEW_KEYS; do
            if [[ ! " $APPROVED_KEYS " =~ " $key " ]]; then
              echo "🚨 Unauthorized new placeholder '$key' added in application.properties! Build stopped."
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Restore Maven Package
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('/*.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t chichia/devopwork:latest .

      - name: Push Docker image to Docker Hub
        run: docker push chichia/devopwork:latest
