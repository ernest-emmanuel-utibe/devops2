name: Deploy Dockerhub

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Fetch full history for comparison

      - name: Find Previous Commit on Dev Before Merge
        run: |
          git fetch origin dev
          
          # Get last commit before merge
          PREV_COMMIT=$(git rev-parse origin/dev^)
          
          echo "Previous commit before merge: $PREV_COMMIT"
          echo "PREV_COMMIT=$PREV_COMMIT" >> $GITHUB_ENV

      - name: Check for Changes in application.properties
        run: |
          # Compare application.properties from before merge to after merge
          if git diff --exit-code $PREV_COMMIT HEAD -- src/main/resources/application.properties; then
            echo "✅ No changes in application.properties. Proceeding..."
          else
            echo "🚨 application.properties has been modified! Build stopped."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Restore Maven Package
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('/*.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t chichia/devopwork:latest .

      - name: Push Docker image to Docker Hub
        run: docker push chichia/devopwork:latest
